<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lift Log — Daniel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f0c;
    --bg-2: #161813;
    --ink: #f4f1e8;
    --ink-dim: #9a9788;
    --accent: #d4ff3a;
    --accent-dim: #6b7a1c;
    --danger: #ff5a3a;
    --warn: #ffb53a;
    --line: #2a2c25;
    --card: #1a1c17;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  body {
    background-image:
      radial-gradient(at 10% 0%, rgba(212,255,58,0.04) 0%, transparent 40%),
      radial-gradient(at 90% 100%, rgba(212,255,58,0.03) 0%, transparent 40%);
    min-height: 100vh;
    padding: 20px 16px 80px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* Header */
  header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 22px;
  }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    line-height: 1;
    color: var(--ink);
  }
  .brand .accent { color: var(--accent); }
  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--ink-dim);
    margin-top: 6px;
  }

  /* Workout selector */
  .selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 22px;
  }
  .selector button {
    background: var(--card);
    color: var(--ink-dim);
    border: 1px solid var(--line);
    padding: 14px 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s ease;
    border-radius: 4px;
  }
  .selector button.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .selector button .label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    opacity: 0.7;
    margin-top: 2px;
  }

  /* Session header */
  .session-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .session-meta .date { color: var(--accent); }

  /* Soreness check */
  .soreness {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--warn);
    padding: 14px;
    margin-bottom: 22px;
    border-radius: 4px;
  }
  .soreness-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--warn);
    margin-bottom: 4px;
  }
  .soreness-prompt {
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .soreness-scale {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .soreness-scale button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 10px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .soreness-scale button:hover { border-color: var(--accent-dim); }
  .soreness-scale button.selected {
    background: var(--warn);
    color: #000;
    border-color: var(--warn);
  }
  .soreness-feedback {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 10px;
    line-height: 1.5;
    display: none;
  }
  .soreness-feedback.show { display: block; }
  .soreness-feedback.green { color: var(--accent); }
  .soreness-feedback.red { color: var(--danger); }

  /* Exercise card */
  .exercise {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .exercise-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .exercise-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .exercise-target {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .last-session {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent-dim);
    margin-top: 6px;
    letter-spacing: 1px;
  }
  .last-session .arrow { color: var(--accent); }

  /* Sets grid */
  .sets {
    padding: 12px 16px 16px;
  }
  .sets-header {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 50px;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-dim);
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .set-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 50px;
    gap: 10px;
    align-items: center;
    margin-bottom: 6px;
  }
  .set-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--ink-dim);
    text-align: center;
  }
  .set-row.done .set-num { color: var(--accent); }
  .set-row input {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    text-align: center;
    border-radius: 4px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  .set-row input:focus {
    border-color: var(--accent);
  }
  .set-row input::placeholder { color: #4a4d42; }
  .set-check {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 10px 0;
    font-size: 16px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .set-check.done {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  /* Effort rating per exercise */
  .effort {
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .effort-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .effort-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .effort-buttons button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 8px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .effort-buttons button.easy.selected { background: var(--accent); color: #000; border-color: var(--accent); }
  .effort-buttons button.medium.selected { background: var(--warn); color: #000; border-color: var(--warn); }
  .effort-buttons button.hard.selected { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* Progression flag */
  .progression-flag {
    background: rgba(212, 255, 58, 0.08);
    border: 1px solid var(--accent-dim);
    border-left: 3px solid var(--accent);
    padding: 10px 12px;
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    border-radius: 4px;
    display: none;
    line-height: 1.4;
  }
  .progression-flag.show { display: block; }

  /* Save bar */
  .save-bar {
    position: sticky;
    bottom: 0;
    background: linear-gradient(180deg, transparent 0%, var(--bg) 30%);
    padding: 20px 0 0;
    margin-top: 24px;
  }
  .save-btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 4px;
    transition: transform 0.1s;
  }
  .save-btn:active { transform: scale(0.98); }
  .save-btn.saved { background: var(--accent-dim); color: var(--ink); }

  /* History toggle */
  .history-toggle {
    width: 100%;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 10px;
  }

  /* History panel */
  .history {
    display: none;
    margin-top: 16px;
  }
  .history.show { display: block; }
  .history-entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .history-entry-header {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .history-entry-header .type { color: var(--accent); }
  .history-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.6;
    padding: 2px 0;
  }
  .history-line .name { color: var(--ink-dim); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: #000;
    padding: 12px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-radius: 4px;
    transition: transform 0.3s;
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">LIFT<span class="accent">/</span>LOG</div>
    <div class="tagline">Sustainable &gt; Optimal · 5×5 Phase</div>
  </header>

  <!-- Workout selector -->
  <div class="selector">
    <button id="btn-a" class="active" onclick="selectWorkout('A')">
      Workout A
      <span class="label">Push + Squat</span>
    </button>
    <button id="btn-b" onclick="selectWorkout('B')">
      Workout B
      <span class="label">Pull + Hinge</span>
    </button>
  </div>

  <div class="session-meta">
    <span id="session-label">Today's Session</span>
    <span class="date" id="session-date"></span>
  </div>

  <!-- Soreness check from last session -->
  <div class="soreness" id="soreness-box" style="display:none;">
    <div class="soreness-title">Soreness Check · 48hr</div>
    <div class="soreness-prompt" id="soreness-prompt">How sore are you from your last session?</div>
    <div class="soreness-scale">
      <button onclick="setSoreness(1)">None</button>
      <button onclick="setSoreness(2)">Mild</button>
      <button onclick="setSoreness(3)">Moderate</button>
      <button onclick="setSoreness(4)">Heavy</button>
      <button onclick="setSoreness(5)">Severe</button>
    </div>
    <div class="soreness-feedback" id="soreness-feedback"></div>
  </div>

  <!-- Exercises render here -->
  <div id="exercises"></div>

  <div class="save-bar">
    <button class="save-btn" id="save-btn" onclick="saveSession()">Save Session</button>
    <button class="history-toggle" onclick="toggleHistory()">View History ↓</button>
  </div>

  <div class="history" id="history"></div>

</div>

<div class="toast" id="toast">Session saved</div>

<script>
  // ===== Workout definitions =====
  const workouts = {
    A: {
      name: "Workout A — Push + Squat",
      exercises: [
        { id: 'a1', name: 'Barbell Back Squat', target: '5 × 5 · 6/10 effort · use safeties' },
        { id: 'a2', name: 'Barbell Bench / Cable Chest Press', target: '5 × 5 · cable if shoulder grumbles' },
        { id: 'a3', name: 'Cable Row (low pulley)', target: '5 × 5 · squeeze shoulder blades' },
        { id: 'a4', name: 'Barbell RDL', target: '5 × 5 · hinge, soft knees' },
        { id: 'a5', name: 'Cable Pallof Press', target: '3 × 10 each side · anti-rotation' }
      ]
    },
    B: {
      name: "Workout B — Pull + Hinge",
      exercises: [
        { id: 'b1', name: 'Barbell RDL / Trap Bar Deadlift', target: '5 × 5 · posterior chain' },
        { id: 'b2', name: 'Lat Pulldown', target: '5 × 5 · neutral or wide grip' },
        { id: 'b3', name: 'Barbell Bulgarian Split Squat', target: '5 × 5 each leg · bar on back' },
        { id: 'b4', name: 'Landmine Press', target: '5 × 5 each side · shoulder-safe pressing' },
        { id: 'b5', name: 'Cable Rotational Chop (high→low)', target: '3 × 8 each side · swing power' }
      ]
    }
  };

  let currentWorkout = 'A';
  let sessionData = {};
  let sorenessRating = null;

  // ===== Storage helpers =====
  function loadHistory() {
    try {
      const raw = localStorage.getItem('liftlog_history');
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveHistory(h) {
    try { localStorage.setItem('liftlog_history', JSON.stringify(h)); } catch (e) {}
  }
  function getLastSessionOfType(type) {
    const hist = loadHistory();
    return hist.filter(s => s.type === type).slice(-1)[0] || null;
  }
  function getMostRecentSession() {
    const hist = loadHistory();
    return hist.slice(-1)[0] || null;
  }

  // ===== UI rendering =====
  function fmtDate(d) {
    const date = new Date(d);
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function selectWorkout(type) {
    currentWorkout = type;
    document.getElementById('btn-a').classList.toggle('active', type === 'A');
    document.getElementById('btn-b').classList.toggle('active', type === 'B');
    sessionData = {};
    sorenessRating = null;
    renderSession();
  }

  function renderSession() {
    const wk = workouts[currentWorkout];
    document.getElementById('session-label').textContent = wk.name;
    document.getElementById('session-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    // Soreness check — only show if there's a recent session
    const lastAny = getMostRecentSession();
    const sorenessBox = document.getElementById('soreness-box');
    if (lastAny) {
      sorenessBox.style.display = 'block';
      const daysAgo = Math.round((Date.now() - new Date(lastAny.date).getTime()) / 86400000);
      document.getElementById('soreness-prompt').textContent =
        `How sore are you from your ${lastAny.type === 'A' ? 'Workout A' : 'Workout B'} (${daysAgo === 0 ? 'today' : daysAgo + 'd ago'})?`;
    } else {
      sorenessBox.style.display = 'none';
    }

    // Exercises
    const lastSameType = getLastSessionOfType(currentWorkout);
    const container = document.getElementById('exercises');
    container.innerHTML = '';

    wk.exercises.forEach(ex => {
      const lastEx = lastSameType?.exercises?.[ex.id];
      const lastLine = lastEx
        ? `<div class="last-session"><span class="arrow">→</span> Last: ${lastEx.sets.map(s => `${s.w || '–'}×${s.r || '–'}`).join(' · ')} · ${lastEx.effort || 'no effort logged'}</div>`
        : `<div class="last-session"><span class="arrow">→</span> First time logging this</div>`;

      const card = document.createElement('div');
      card.className = 'exercise';
      card.innerHTML = `
        <div class="exercise-header">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-target">${ex.target}</div>
          ${lastLine}
        </div>
        <div class="sets">
          <div class="sets-header">
            <div>Set</div>
            <div>Weight (lb)</div>
            <div>Reps</div>
            <div>✓</div>
          </div>
          ${[1,2,3,4,5].map(n => `
            <div class="set-row" data-ex="${ex.id}" data-set="${n}">
              <div class="set-num">${n}</div>
              <input type="number" inputmode="decimal" placeholder="${lastEx?.sets?.[n-1]?.w || '–'}" data-field="w" />
              <input type="number" inputmode="numeric" placeholder="5" data-field="r" />
              <button class="set-check" onclick="toggleSetDone('${ex.id}', ${n})">○</button>
            </div>
          `).join('')}

          <div class="effort">
            <div class="effort-label">Overall effort on this lift</div>
            <div class="effort-buttons" data-ex="${ex.id}">
              <button class="easy" onclick="setEffort('${ex.id}', 'easy')">Easy · 6/10</button>
              <button class="medium" onclick="setEffort('${ex.id}', 'medium')">Solid · 7-8/10</button>
              <button class="hard" onclick="setEffort('${ex.id}', 'hard')">Grinding · 9+</button>
            </div>
            <div class="progression-flag" id="prog-${ex.id}">
              ✓ All sets logged at "Easy" — green light to add weight next session
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    // Add input listeners
    container.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', handleInput);
    });
  }

  function handleInput(e) {
    const row = e.target.closest('.set-row');
    const exId = row.dataset.ex;
    const setN = parseInt(row.dataset.set);
    const field = e.target.dataset.field;
    if (!sessionData[exId]) sessionData[exId] = { sets: [{},{},{},{},{}], effort: null };
    sessionData[exId].sets[setN - 1][field] = e.target.value;
  }

  function toggleSetDone(exId, setN) {
    const row = document.querySelector(`.set-row[data-ex="${exId}"][data-set="${setN}"]`);
    const btn = row.querySelector('.set-check');
    const isDone = btn.classList.toggle('done');
    row.classList.toggle('done', isDone);
    btn.textContent = isDone ? '✓' : '○';
  }

  function setEffort(exId, level) {
    if (!sessionData[exId]) sessionData[exId] = { sets: [{},{},{},{},{}], effort: null };
    sessionData[exId].effort = level;
    const buttons = document.querySelectorAll(`.effort-buttons[data-ex="${exId}"] button`);
    buttons.forEach(b => b.classList.remove('selected'));
    const cls = level === 'easy' ? 'easy' : level === 'medium' ? 'medium' : 'hard';
    document.querySelector(`.effort-buttons[data-ex="${exId}"] button.${cls}`).classList.add('selected');

    // Progression flag for "easy"
    const flag = document.getElementById(`prog-${exId}`);
    flag.classList.toggle('show', level === 'easy');
  }

  function setSoreness(level) {
    sorenessRating = level;
    const buttons = document.querySelectorAll('.soreness-scale button');
    buttons.forEach((b, i) => b.classList.toggle('selected', i + 1 === level));

    const fb = document.getElementById('soreness-feedback');
    fb.classList.add('show');
    fb.classList.remove('green', 'red');
    if (level <= 2) {
      fb.classList.add('green');
      fb.textContent = '→ Good. Recovery is on track. Stick with current weights or test a small bump if all sets felt easy last time.';
    } else if (level === 3) {
      fb.textContent = '→ Moderate is the ceiling. Hold weights flat today. Don\'t add load.';
    } else {
      fb.classList.add('red');
      fb.textContent = '→ Red flag. We pushed too hard. Drop today\'s weights by 10-15% across the board, or swap for a walk + mobility day.';
    }
  }

  function saveSession() {
    const wk = workouts[currentWorkout];
    const session = {
      date: new Date().toISOString(),
      type: currentWorkout,
      soreness: sorenessRating,
      exercises: {}
    };
    wk.exercises.forEach(ex => {
      if (sessionData[ex.id]) {
        session.exercises[ex.id] = {
          name: ex.name,
          sets: sessionData[ex.id].sets,
          effort: sessionData[ex.id].effort
        };
      }
    });

    const hist = loadHistory();
    hist.push(session);
    saveHistory(hist);

    showToast('Session saved');
    const btn = document.getElementById('save-btn');
    btn.classList.add('saved');
    btn.textContent = '✓ Saved';
    setTimeout(() => {
      btn.classList.remove('saved');
      btn.textContent = 'Save Session';
    }, 2000);

    renderHistory();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function toggleHistory() {
    const h = document.getElementById('history');
    const isOpen = h.classList.toggle('show');
    if (isOpen) renderHistory();
  }

  function renderHistory() {
    const h = document.getElementById('history');
    const hist = loadHistory().slice().reverse();
    if (hist.length === 0) {
      h.innerHTML = '<div class="empty">No sessions logged yet. Save your first one above.</div>';
      return;
    }
    h.innerHTML = hist.map(s => {
      const lines = Object.values(s.exercises).map(ex => {
        const setStr = ex.sets
          .filter(st => st.w || st.r)
          .map(st => `${st.w || '–'}×${st.r || '–'}`)
          .join(' · ') || '(no sets logged)';
        return `<div class="history-line"><span class="name">${ex.name}:</span> ${setStr}${ex.effort ? ` · <em>${ex.effort}</em>` : ''}</div>`;
      }).join('');
      const sorenessStr = s.soreness ? ` · soreness ${['none','mild','moderate','heavy','severe'][s.soreness-1]}` : '';
      return `
        <div class="history-entry">
          <div class="history-entry-header">
            <span class="type">Workout ${s.type}</span>
            <span>${fmtDate(s.date)}${sorenessStr}</span>
          </div>
          ${lines || '<div class="history-line">No exercises logged</div>'}
        </div>
      `;
    }).join('');
  }

  // ===== Init =====
  renderSession();
</script>
</body>
</html>
